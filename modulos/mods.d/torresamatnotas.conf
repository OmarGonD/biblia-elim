About=Las notas con que don Félix Torres Amat acompañó su traducción de la Vulgata. Son parte principal de la obra: explican el pasaje, citan a los Santos Padres, discuten el hebreo y el griego y salen al paso de las objeciones de su siglo.\par\par Dominio público, como el texto que acompañan.\par\par Cada grupo de notas va con los versículos de la página impresa en que estaba. La llamada de nota es en el original un superíndice diminuto que el reconocimiento óptico se come o pega a la palabra vecina, así que no se sabe a qué versículo concreto de la página comenta cada una: verás las de toda la página junto a cada uno de sus versículos. Están revisadas solo en lo evidente (ortografía, ornatos de lámina y números romanos de las citas); conservan erratas del reconocimiento óptico, sobre todo en las palabras griegas y en algunas citas.
