About=Las notas con que don Félix Torres Amat acompañó su traducción de la Vulgata. Son parte principal de la obra: explican el pasaje, citan a los Santos Padres, discuten el hebreo y el griego y salen al paso de las objeciones de su siglo.\par\par Dominio público, como el texto que acompañan.\par\par ATENCIÓN: van agrupadas POR CAPÍTULO, en el orden en que están impresas, y no por versículo. La llamada de nota es en el original un superíndice diminuto que el reconocimiento óptico se come o pega a la palabra vecina: contando llamadas y notas de una misma página solo coinciden en el 6 % de los casos. Atribuir cada nota a un versículo con esos datos sería inventárselo. Tampoco están revisadas: conservan las erratas del reconocimiento óptico.
