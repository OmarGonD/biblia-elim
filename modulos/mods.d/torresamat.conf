About=La Sagrada Biblia, nuevamente traducida de la Vulgata latina al español, por don Félix Torres Amat (1772-1847), obispo de Astorga. Publicada entre 1823 y 1825, fue la primera traducción católica de la Biblia al castellano que alcanzó difusión amplia. Base textual: la Vulgata latina, aclarado el sentido de algunos lugares con la luz que dan los textos originales hebreo y griego.\par\par Dominio público: Torres Amat murió en 1847.\par\par ATENCIÓN: este módulo se ha generado por reconocimiento óptico del juego de cuatro tomos de la edición de 1882 conservado en Internet Archive, y NO ESTÁ REVISADO. Trae 33.672 de los 35.817 versículos (94,0 %); el resto aparece en blanco. No queda ningún capítulo vacío, y el cotejo con la Vulgata por nombres propios sitúa 1.311 de los 1.334 capítulos en su lugar, sin ninguno corrido; los 23 restantes no traen nombres suficientes para pronunciarse. Se ha pasado un corrector de erratas que usa el propio texto como diccionario -- 468 arreglos en 566 versículos, del tipo \\"tereero\\" por \\"tercero\\" --, pero queda mucha errata suelta dentro de los versículos. Las notas de Torres Amat van en un módulo aparte, TorresAmatNotas. El texto conserva erratas del reconocimiento óptico, un capítulo ha quedado sin una sola línea y otros 47 están bajo sospecha de llevar la numeración corrida un puesto. No debe usarse como texto de referencia sin cotejarlo. Las notas de Torres Amat, que son parte principal de la obra, no se han importado.
