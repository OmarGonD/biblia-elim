About=La Sagrada Biblia, nuevamente traducida de la Vulgata latina al español, por don Félix Torres Amat (1772-1847), obispo de Astorga. Publicada entre 1823 y 1825, fue la primera traducción católica de la Biblia al castellano que alcanzó difusión amplia. Base textual: la Vulgata latina, aclarado el sentido de algunos lugares con la luz que dan los textos originales hebreo y griego.\par\par Dominio público: Torres Amat murió en 1847.\par\par ATENCIÓN: este módulo se ha generado por reconocimiento óptico del juego de cuatro tomos de la edición de 1882 conservado en Internet Archive, y NO ESTÁ REVISADO. Trae 33.501 de los 35.817 versículos (93,5 %); el resto aparece en blanco. El texto presente conserva erratas del reconocimiento óptico, 14 capítulos han quedado sin una sola línea y otros 46 están bajo sospecha de llevar la numeración corrida un puesto. No debe usarse como texto de referencia sin cotejarlo. Las notas de Torres Amat, que son parte principal de la obra, no se han importado.
