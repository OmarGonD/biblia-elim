name: builds

"on":
  push: {}
  pull_request: {}

jobs:
  windows:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - "-win32"
          - "-win64"
    steps:
      - name: checkout Xiphos
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: fetch history
        run: |
          git fetch origin +refs/tags/*:refs/tags/*
      - name: build windows targets
        shell: bash
        id: build
        run: |
          set -ex -o pipefail
          docker build -t xiphos win32
          docker run -i --rm -v "$(pwd):/source" xiphos ${{ matrix.version }}
      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers${{ matrix.version }}
          path: "*.exe"

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: checkout Xiphos
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: fetch history
        run: git fetch origin +refs/tags/*:refs/tags/*
      - name: install dependencies
        run: |
          brew install cmake pkgconf gtk4 sword libsoup sqlite icu4c gettext \
            libxml2 libxslt minizip json-glib itstool yelp-tools util-linux
          git clone --branch 2.1.0 https://github.com/karlkleinpaste/biblesync.git \
            "$RUNNER_TEMP/biblesync"
          cmake -S "$RUNNER_TEMP/biblesync" -B "$RUNNER_TEMP/biblesync-build" \
            -DCMAKE_INSTALL_PREFIX="$(brew --prefix)"
          cmake --build "$RUNNER_TEMP/biblesync-build" --parallel
          cmake --install "$RUNNER_TEMP/biblesync-build"
      - name: build and package macOS app
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix icu4c)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=TRUE
          cmake --build build --parallel
          cpack --config build/CPackConfig.cmake
      - name: upload installer
        uses: actions/upload-artifact@v7
        with:
          name: macos-installers-${{ matrix.arch }}
          path: "build/*.pkg"

  arch_gtk4_libsoup3:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: checkout xiphos
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            appstream \
            biblesync \
            binutils \
            cmake \
            docbook-utils \
            enchant \
            gcc \
            git \
            glib2-devel \
            gnome-common \
            gtk4 \
            intltool \
            libsoup3 \
            libxml2 \
            make \
            minizip \
            pkg-config \
            python \
            speech-dispatcher \
            sword \
            zip
      - name: build xiphos
        run: |
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_MAKE_PROGRAM=make .
          make -C build -j$(nproc)
          make -C build mhelp package_source

  fedora_gtk4_libsoup3:
    runs-on: ubuntu-latest
    container:
      image: fedora:45
    steps:
      - name: checkout xiphos
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: install dependencies
        run: |
          dnf install -y \
            appstream \
            biblesync-devel \
            cmake \
            desktop-file-utils \
            git \
            docbook-utils \
            gcc-c++ \
            gtk4-devel \
            intltool \
            itstool \
            libsoup3-devel \
            libuuid-devel \
            libxml2-devel \
            make \
            minizip-devel \
            rpm-build \
            speech-dispatcher-devel \
            sword-devel \
            yelp \
            yelp-tools \
            zip
      - name: build xiphos
        run: |
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_MAKE_PROGRAM=make .
          make -C build -j$(nproc)
          make -C build mhelp package_source

  debian_gtk4_libsoup3:
    runs-on: ubuntu-latest
    container:
      image: debian:testing
    steps:
      - name: checkout xiphos
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: install dependencies
        run: |
          apt-get update
          apt-get install -y \
            appstream \
            cmake \
            docbook-utils \
            g++ \
            desktop-file-utils \
            fp-utils \
            gsettings-desktop-schemas-dev \
            intltool \
            itstool \
            libbiblesync-dev \
            libenchant-2-dev \
            libgtk-4-dev \
            libminizip-dev \
            libsoup-3.0-dev \
            libspeechd-dev \
            libsword-dev \
            libxml2-dev \
            libxml2-utils \
            make \
            python-dev-is-python3 \
            uuid-dev \
            uuid-runtime \
            yelp-tools \
            zip
      - name: build xiphos
        run: |
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_MAKE_PROGRAM=make .
          make -C build -j$(nproc)
          make -C build mhelp package_source

  ubuntu_gtk4_libsoup3:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: checkout xiphos
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: install dependencies
        run: |
          apt-get update
          apt-get install -y \
            appstream \
            cmake \
            g++ \
            desktop-file-utils \
            fp-utils \
            gsettings-desktop-schemas-dev \
            intltool \
            itstool \
            libbiblesync-dev \
            libenchant-2-dev \
            libgtk-4-dev \
            libminizip-dev \
            libspeechd-dev \
            libsword-dev \
            libxml2-dev \
            libxml2-utils \
            make \
            python3-dev \
            swig \
            uuid-dev \
            uuid-runtime \
            yelp-tools \
            zip
      - name: build xiphos
        run: |
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_MAKE_PROGRAM=make .
          make -C build -j$(nproc)
          make -C build mhelp package_source

  deploy:
    needs:
      - windows
      - macos
      - arch_gtk4_libsoup3
      - debian_gtk4_libsoup3
      - fedora_gtk4_libsoup3
      - ubuntu_gtk4_libsoup3
    if: contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: checkout source
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          ref: ${{ github.ref }}
      - name: download all the artifacts
        uses: actions/download-artifact@v8
      - name: prepare for release
        id: release
        run: |
          set -ex
          mkdir source
          tag="${GITHUB_REF#refs/tags/}"
          git archive -o "source/xiphos-${tag}.tar" --prefix "xiphos-${tag}/" "${tag}"
          xz "source/xiphos-${tag}.tar"
          echo "tag=${tag}" >> $GITHUB_OUTPUT
          pwd
      - name: create release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: >
            source/*,
            macos-installers-*/*,
            windows-installers-win32/*,
            windows-installers-win64/*
          allowUpdates: true
          name: Release ${{ steps.release.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
